<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keep Me in Suspense!</title>
  <link rel="stylesheet" href="../vars.css" />
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="index.css" />
  <script src="index.js" type="module"></script>
</head>
<body>

  <!-- ═══════════════════════════════ HEADER ═══════════════════════════════════ -->

  <header class="header">
    <span class="app-title">Keep Me<br>In Suspense!</span>
    <div class="header-right">
      <label class="master-toggle">
        <input type="checkbox" id="masterEnabled" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Active</span>
      </label>
      <button id="suspendBtn" class="header-action-btn hidden">Suspend current tab</button>
      <button id="unsuspendCurrentBtn" class="header-action-btn hidden">Unsuspend tab</button>
    </div>
  </header>

  <!-- ════════════════════════════ STATUS BAR ══════════════════════════════════ -->

  <!-- Shown when current tab is matched by an activation rule -->
  <div id="activeRuleSection" class="active-rule-section hidden">
    <p class="active-rule-summary">
      Suspends in <span id="activeRuleDelay"></span>
    </p>
    <p class="active-rule-name">
      Rule: <span id="activeRuleName"></span
      ><span id="activeRuleGroupTag" class="hidden"> (Tab Group)</span>
    </p>
    <div class="active-rule-actions">
      <!-- Hidden when the activation rule already exactly matches this URL -->
      <button id="addToWhitelistBtn" class="active-rule-btn hidden">
        Add to whitelist
      </button>
      <!-- Inline form - shown after clicking "Add to whitelist" -->
      <fieldset id="whitelistInlineForm" class="inline-form hidden">
        <legend>Add to whitelist</legend>
        <input type="text" id="whitelistInput" class="inline-input" />
        <div class="inline-form-actions">
          <button id="whitelistConfirmBtn">Confirm</button>
          <button id="whitelistCancelBtn" class="btn-cancel">Cancel</button>
        </div>
      </fieldset>
      <button id="removeRuleBtn" class="active-rule-btn active-rule-btn-danger">
        Remove rule
      </button>
    </div>
  </div>

  <!-- Shown when current tab is whitelisted -->
  <div id="statusWhitelisted" class="whitelisted-section hidden">
    <p id="whitelistSummary" class="active-rule-summary"></p>
    <p id="whitelistRuleRow" class="active-rule-name hidden">
      Rule: <span id="statusWhitelistRule"></span>
    </p>
    <button id="removeWhitelistBtn" class="remove-whitelist-btn hidden">
      Remove rule
    </button>
  </div>

  <!-- Shown when no rule matches the current tab -->
  <div id="statusNone" class="no-rule-msg hidden">
    <span class="no-rule-icon">○</span>
    <span>No activation rule for this page</span>
  </div>

  <!-- ══════════════════════════ ADD ACTIVATION RULE ═══════════════════════════ -->

  <!-- Template cloned once per generated URL/group pattern -->
  <template id="patternItemTpl">
    <li class="pattern-item">
      <span class="pattern-label"></span>
      <span class="pattern-icon">+</span>
    </li>
  </template>

  <!-- Shown for normal trackable pages -->
  <div id="addSection" class="popup-card hidden">
    <h2 class="popup-card-title">Auto suspend this page</h2>
    <div class="delay-row">
      Activate after
      <input type="number" id="delay" min="1" value="5" />
      min
    </div>
    <ul class="pattern-list">
      <!-- Generated pattern rows are inserted here by JS -->
      <!-- Custom pattern - user edits before confirming -->
      <li id="p4" class="pattern-item pattern-custom">
        <span class="pattern-label">+ Add custom...</span>
      </li>
    </ul>
    <!-- Inline form - shown after clicking "Add custom..." -->
    <div id="customInlineForm" class="inline-form inline-form-group hidden">
      <input type="text" id="customInput" class="inline-input" />
      <div class="inline-form-actions">
        <button id="customConfirmBtn">Add Rule</button>
        <button id="customCancelBtn" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Shown when the page can't have rules (browser internal pages, extension pages) -->
  <p id="noUrlMsg" class="no-url hidden">No rules available for this page.</p>

  <!-- ════════════════════════════════ ACTIONS ═════════════════════════════════ -->

  <div class="popup-card">
    <h2 class="popup-card-title">Actions</h2>

    <!-- Bulk actions: two groups side by side -->
    <div class="bulk-actions">
      <div class="bulk-group">
        <span class="bulk-label">This window</span>
        <button id="suspendOthersWindowBtn" class="action-btn">Suspend others</button>
        <button id="suspendAllWindowBtn"    class="action-btn">Suspend all</button>
        <button id="unsuspendAllWindowBtn"  class="action-btn">Unsuspend all</button>
      </div>
      <div class="bulk-group">
        <span class="bulk-label">All windows</span>
        <button id="suspendOthersAllBtn" class="action-btn">Suspend others</button>
        <button id="suspendAllAllBtn"    class="action-btn">Suspend all</button>
        <button id="unsuspendAllBtn"     class="action-btn">Unsuspend all</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════ FOOTER ════════════════════════════════════ -->

  <div class="popup-footer">
    <button id="configBtn" class="config-btn">Configuration →</button>
  </div>

</body>
</html>
